name: iOS IPA

# Builds the unsigned iPhone app on iOS pushes and is the only workflow that
# publishes it as a release. Manual runs build and upload the artifact only.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select installed stable Xcode
        run: |
          set -euo pipefail
          XCODE_PATH=$(python3 - <<'PY'
          import glob, re
          paths = []
          for path in glob.glob('/Applications/Xcode_*.app'):
              match = re.fullmatch(r'/Applications/Xcode_([0-9.]+)\.app', path)
              if match:
                  paths.append((tuple(map(int, match[1].split('.'))), path))
          if not paths:
              raise SystemExit('No stable Xcode installed')
          print(max(paths)[1])
          PY
          )
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun swift --version
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Compile unsigned iPhone archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive -project Schoolity.xcodeproj -scheme Schoolity \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Schoolity.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tee build/archive.log
          mkdir -p build/ipa/Payload
          ditto build/Schoolity.xcarchive/Products/Applications/Schoolity.app build/ipa/Payload/Schoolity.app
          ditto -c -k --keepParent build/ipa/Payload build/Schoolity.ipa
      - name: Upload Schoolity.ipa
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Schoolity-IPA
          path: ios/build/Schoolity.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Summarize the IPA
        run: |
          set -euo pipefail
          echo "### Schoolity.ipa" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned iPhone archive, $(du -h build/Schoolity.ipa | cut -f1). Download the artifact and unzip it; sign the IPA before installing." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish IPA release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize releases so each app.json update builds on the previous commit.
    concurrency:
      group: ios-ipa-app-json
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Download packaged IPA
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: Schoolity-IPA
          path: release
      - name: Publish Schoolity.ipa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Old workflow run numbers already own tags like ios-build-14.1, so
          # include the commit to keep each release tag unique.
          tag="ios-build-${BUILD_NUMBER}.${BUILD_ATTEMPT}-${COMMIT_SHA:0:7}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Native Schoolity iPhone app, packaged automatically. Simulator tests run in the separate iOS workflow; check that workflow for test results.

          Connects directly to Anoka-Hennepin StudentVUE. No Schoolity/Vercel server is required. Internet access to the district is required. Older saved server sessions may require one new school sign-in.

          Download **Schoolity.ipa** below. This build is unsigned and requires Apple signing before installation.

          SideStore, Feather, and AltStore users can add the source: https://raw.githubusercontent.com/verityhoangjacob67/schoolity/main/app.json
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; replacing its IPA."
            gh release upload "$tag" release/Schoolity.ipa --clobber
          else
            gh release create "$tag" release/Schoolity.ipa \
              --target "$COMMIT_SHA" --title "Schoolity iOS - Build ${BUILD_NUMBER}.${BUILD_ATTEMPT}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          url=$(gh release view "$tag" --json url --jq .url)
          echo "### [Download Schoolity.ipa]($url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the SideStore source
        env:
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="ios-build-${BUILD_NUMBER}.${BUILD_ATTEMPT}-${COMMIT_SHA:0:7}"
          python3 .github/scripts/update_app_json.py \
            --app-json app.json \
            --ipa release/Schoolity.ipa \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Schoolity.ipa" \
            --date "$(date -u +%F)"
          if git diff --quiet -- app.json; then
            echo "app.json already lists this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Update app.json for ${tag}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto main." >&2
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort
              exit 1
            }
          done
          echo "Could not push app.json after 3 attempts." >&2
          exit 1
